<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | BETON LIGHTING</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/lucide@latest/dist/umd/lucide.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --color-primary: #134095;
            --color-accent: #EF7F1A;
            --color-background: #f8fafc;
            --color-surface: #ffffff;
            --color-border: #cbd5e1;
            --color-text: #1e293b;
            --color-text-muted: #64748b;
        }

        body { background-color: var(--color-background); font-family: 'Montserrat', sans-serif; color: var(--color-text); margin: 0; padding: 0; }
        .admin-container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--color-border); padding-bottom: 1rem; }
        .btn { padding: 0.75rem 1.5rem; background: var(--color-primary); color: white; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 500; font-family: 'Montserrat', sans-serif; font-size: 0.925rem; transition: background-color 0.2s; }
        .btn:hover { background: #0f3378; }
        .btn-outline { background: transparent; border: 1px solid var(--color-primary); color: var(--color-primary); }
        .btn-outline:hover { background: rgba(19, 64, 149, 0.05); }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 8px; padding: 1.5rem; margin-bottom: 2rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 1rem; border-bottom: 1px solid var(--color-border); }
        th { font-weight: 600; color: var(--color-text-muted); }
        .tabs { display: flex; gap: 1rem; margin-bottom: 2rem; }
        .tab { padding: 0.75rem 1.5rem; background: transparent; border: 1px solid var(--color-border); border-radius: 4px; cursor: pointer; color: var(--color-text); font-family: 'Montserrat', sans-serif; font-weight: 500; }
        .tab.active { background: var(--color-primary); color: white; border-color: var(--color-primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.875rem; color: var(--color-text); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.75rem; border: 1px solid var(--color-border); border-radius: 6px; background: var(--color-surface); color: var(--color-text); font-family: 'Montserrat', sans-serif; box-sizing: border-box; font-size: 0.925rem; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(19, 64, 149, 0.15); }
        
        #login-section {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--color-background);
            margin: 0;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 50;
        }
        .login-card {
            background: var(--color-surface);
            padding: 3rem 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--color-border);
            box-sizing: border-box;
        }
        .login-header { text-align: center; margin-bottom: 2rem; }
        .login-header h1 { font-size: 2rem; font-weight: 700; color: var(--color-primary); letter-spacing: 0.05em; margin-bottom: 0.25rem; }
        .login-header p.subtitle { text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.15em; font-weight: 600; color: var(--color-accent); margin-bottom: 1.5rem; }
        .login-header p.desc { color: var(--color-text-muted); font-size: 0.875rem; }
        .auth-links { display: flex; justify-content: space-between; margin-top: 1rem; font-size: 0.875rem; }
        .auth-links a { color: var(--color-primary); text-decoration: none; font-weight: 500; }
        .auth-links a:hover { text-decoration: underline; }
        .login-footer { margin-top: 2rem; text-align: center; font-size: 0.875rem; color: var(--color-text-muted); border-top: 1px solid var(--color-border); padding-top: 1.5rem; }
        .login-footer a { color: var(--color-primary); text-decoration: none; font-weight: 500; }
        .login-footer a:hover { text-decoration: underline; }
        .hidden { display: none !important; }
        
        #dashboard-section { display: none; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: var(--color-surface); padding: 2rem; border-radius: 8px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .close-modal { background: none; border: none; color: var(--color-text); cursor: pointer; font-size: 1.5rem; }
    </style>
</head>
<body>
    <div id="login-section">
        <div class="login-card">
            <div class="login-header">
                <h1>BETON</h1>
                <p class="subtitle">Admin Dashboard</p>
                <p class="desc">Enter your credentials to access the portal</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" required placeholder="admin@betonlighting.com" value="admin@betonlighting.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn" style="width: 100%; justify-content: center; margin-top: 1.75rem; padding: 0.75rem; font-size: 1rem;">Log In</button>
                <p id="login-error" style="color: #ef4444; margin-top: 1rem; text-align: center; display: none;"></p>
            </form>
        </div>
    </div>

    <div id="dashboard-section" class="admin-container">
        <div class="admin-header">
            <div>
                <h1>Admin Dashboard</h1>
                <p style="color: var(--color-text-muted);">Manage products and view inquiries.</p>
            </div>
            <div>
                <a href="index.html" class="btn btn-outline" target="_blank">View Site</a>
                <button id="logout-btn" class="btn">Log Out</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('products')">Products</button>
            <button class="tab" onclick="switchTab('inquiries')">Inquiries</button>
        </div>

        <div id="products-tab" class="tab-content active">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h2>All Products</h2>
                    <button class="btn" onclick="openProductModal()">+ Add Product</button>
                </div>
                <div style="overflow-x: auto;">
                    <table id="products-table">
                        <thead>
                            <tr>
                                <th>Ref</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="inquiries-tab" class="tab-content">
            <div class="card">
                <h2 style="margin-bottom: 1.5rem;">Recent Inquiries</h2>
                <div style="overflow-x: auto;">
                    <table id="inquiries-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Message</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Product Modal -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add Product</h2>
                <button class="close-modal" onclick="closeProductModal()">&times;</button>
            </div>
            <form id="product-form">
                <input type="hidden" id="p-id">
                <div class="form-group">
                    <label>Reference (e.g., B-204)</label>
                    <input type="text" id="p-ref" required>
                </div>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="p-name" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <input type="text" id="p-category" required>
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="text" id="p-image" value="assets/images/products/sys-01.webp" required>
                </div>
                <div class="form-group">
                    <label>Short Description</label>
                    <textarea id="p-short-desc" rows="2"></textarea>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                    <button type="button" class="btn btn-outline" onclick="closeProductModal()">Cancel</button>
                    <button type="submit" class="btn">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script>
        // Tab Switching
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabName + '-tab').classList.add('active');
            if (tabName === 'inquiries') loadInquiries();
        }

        // Auth Logic — hardcoded credentials (no auth library)
        const _a = atob('YWRtaW5AYmV0b25saWdodGluZy5jb20=');
        const _b = atob('QmV0b25AMjAyNg==');

        function showDashboard() {
            sessionStorage.setItem('bl_admin', '1');
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').style.display = 'block';
            loadProducts();
        }

        function checkAuth() {
            if (sessionStorage.getItem('bl_admin') === '1') {
                showDashboard();
            }
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            errorEl.style.display = 'none';

            if (email === _a && password === _b) {
                showDashboard();
            } else {
                errorEl.textContent = 'Invalid email or password.';
                errorEl.style.display = 'block';
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            sessionStorage.removeItem('bl_admin');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('dashboard-section').style.display = 'none';
        });

        // Load Products
        async function loadProducts() {
            try {
                const { data, error } = await supabase.from('products').select('*').order('ref', { ascending: true });
                if (error) {
                    console.error("Error loading products:", error);
                    return alert('Error loading products: ' + error.message);
                }
                
                const tbody = document.querySelector('#products-table tbody');
                tbody.innerHTML = '';
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--color-text-muted);">No products found in the database.</td></tr>';
                    return;
                }
                
                data.forEach(p => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${p.ref}</td>
                        <td>${p.name}</td>
                        <td>${p.category}</td>
                        <td>
                            <button class="btn btn-outline" style="padding: 0.25rem 0.5rem; font-size: 0.875rem;" onclick='editProduct(${JSON.stringify(p).replace(/'/g, "&#39;")})'>Edit</button>
                            <button class="btn btn-danger" style="padding: 0.25rem 0.5rem; font-size: 0.875rem; margin-left: 0.5rem;" onclick="deleteProduct('${p.id}')">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
                alert("System error loading products: " + err.message);
            }
        }

        // Load Inquiries
        async function loadInquiries() {
            try {
                const { data, error } = await supabase.from('inquiries').select('*').order('created_at', { ascending: false });
                if (error) {
                    console.error("Error loading inquiries:", error);
                    return alert('Error loading inquiries: ' + error.message);
                }
                
                const tbody = document.querySelector('#inquiries-table tbody');
                tbody.innerHTML = '';
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--color-text-muted);">No inquiries found.</td></tr>';
                    return;
                }
                
                data.forEach(i => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${new Date(i.created_at).toLocaleDateString()}</td>
                        <td>${i.name}</td>
                        <td><a href="mailto:${i.email}" style="color: var(--color-primary);">${i.email}</a></td>
                        <td><div style="max-height: 100px; overflow-y: auto;">${i.message}</div></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
                alert("System error loading inquiries: " + err.message);
            }
        }

        // Product Modal Logic
        const modal = document.getElementById('product-modal');
        const form = document.getElementById('product-form');

        function openProductModal() {
            form.reset();
            document.getElementById('p-id').value = '';
            document.getElementById('modal-title').textContent = 'Add Product';
            modal.classList.add('active');
        }

        function closeProductModal() {
            modal.classList.remove('active');
        }

        function editProduct(product) {
            document.getElementById('p-id').value = product.id;
            document.getElementById('p-ref').value = product.ref;
            document.getElementById('p-name').value = product.name;
            document.getElementById('p-category').value = product.category;
            document.getElementById('p-image').value = product.image_url || '';
            document.getElementById('p-short-desc').value = product.short_description || '';
            document.getElementById('modal-title').textContent = 'Edit Product';
            modal.classList.add('active');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('p-id').value;
            const productData = {
                ref: document.getElementById('p-ref').value,
                name: document.getElementById('p-name').value,
                category: document.getElementById('p-category').value,
                image_url: document.getElementById('p-image').value,
                short_description: document.getElementById('p-short-desc').value
            };

            let result;
            if (id) {
                result = await supabase.from('products').update(productData).eq('id', id);
            } else {
                result = await supabase.from('products').insert([productData]);
            }

            if (result.error) {
                alert('Error saving product: ' + result.error.message);
            } else {
                closeProductModal();
                loadProducts();
            }
        });

        async function deleteProduct(id) {
            if (confirm('Are you sure you want to delete this product?')) {
                const { error } = await supabase.from('products').delete().eq('id', id);
                if (error) alert('Error deleting product: ' + error.message);
                else loadProducts();
            }
        }

        // Initialize
        checkAuth();
    </script>
</body>
</html>
