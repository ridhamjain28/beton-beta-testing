<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | BETON LIGHTING</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/lucide@latest/dist/umd/lucide.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background-color: var(--color-background); font-family: 'Outfit', sans-serif; color: var(--color-text); margin: 0; padding: 0; }
        .admin-container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--color-border); padding-bottom: 1rem; }
        .btn { padding: 0.5rem 1rem; background: var(--color-primary); color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-outline { background: transparent; border: 1px solid var(--color-primary); color: var(--color-primary); }
        .btn-danger { background: #ef4444; }
        .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 8px; padding: 1.5rem; margin-bottom: 2rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 1rem; border-bottom: 1px solid var(--color-border); }
        th { font-weight: 600; color: var(--color-text-muted); }
        .tabs { display: flex; gap: 1rem; margin-bottom: 2rem; }
        .tab { padding: 0.75rem 1.5rem; background: transparent; border: 1px solid var(--color-border); border-radius: 4px; cursor: pointer; color: var(--color-text); }
        .tab.active { background: var(--color-primary); color: white; border-color: var(--color-primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.75rem; border: 1px solid var(--color-border); border-radius: 4px; background: var(--color-background); color: var(--color-text); font-family: 'Outfit', sans-serif; }
        
        #login-section { max-width: 400px; margin: 4rem auto; }
        #dashboard-section { display: none; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: var(--color-surface); padding: 2rem; border-radius: 8px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .close-modal { background: none; border: none; color: var(--color-text); cursor: pointer; font-size: 1.5rem; }
    </style>
</head>
<body>
    <div id="login-section" class="admin-container card">
        <h2 style="margin-bottom: 1.5rem; text-align: center;">Admin Login</h2>
        <form id="login-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" required value="admin@betonlighting.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="btn" style="width: 100%; justify-content: center;">Log In</button>
            <p id="login-error" style="color: #ef4444; margin-top: 1rem; text-align: center; display: none;"></p>
        </form>
    </div>

    <div id="dashboard-section" class="admin-container">
        <div class="admin-header">
            <div>
                <h1>Admin Dashboard</h1>
                <p style="color: var(--color-text-muted);">Manage products and view inquiries.</p>
            </div>
            <div>
                <a href="index.html" class="btn btn-outline" target="_blank">View Site</a>
                <button id="logout-btn" class="btn">Log Out</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('products')">Products</button>
            <button class="tab" onclick="switchTab('inquiries')">Inquiries</button>
        </div>

        <div id="products-tab" class="tab-content active">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h2>All Products</h2>
                    <button class="btn" onclick="openProductModal()">+ Add Product</button>
                </div>
                <div style="overflow-x: auto;">
                    <table id="products-table">
                        <thead>
                            <tr>
                                <th>Ref</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="inquiries-tab" class="tab-content">
            <div class="card">
                <h2 style="margin-bottom: 1.5rem;">Recent Inquiries</h2>
                <div style="overflow-x: auto;">
                    <table id="inquiries-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Message</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Product Modal -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add Product</h2>
                <button class="close-modal" onclick="closeProductModal()">&times;</button>
            </div>
            <form id="product-form">
                <input type="hidden" id="p-id">
                <div class="form-group">
                    <label>Reference (e.g., B-204)</label>
                    <input type="text" id="p-ref" required>
                </div>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="p-name" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <input type="text" id="p-category" required>
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="text" id="p-image" value="assets/images/products/sys-01.webp" required>
                </div>
                <div class="form-group">
                    <label>Short Description</label>
                    <textarea id="p-short-desc" rows="2"></textarea>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                    <button type="button" class="btn btn-outline" onclick="closeProductModal()">Cancel</button>
                    <button type="submit" class="btn">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script>
        // Tab Switching
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabName + '-tab').classList.add('active');
            if (tabName === 'inquiries') loadInquiries();
        }

        // Auth Logic
        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard-section').style.display = 'block';
                loadProducts();
            } else {
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('dashboard-section').style.display = 'none';
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
            } else {
                errorEl.style.display = 'none';
                checkAuth();
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            checkAuth();
        });

        // Load Products
        async function loadProducts() {
            const { data, error } = await supabase.from('products').select('*').order('ref', { ascending: true });
            if (error) return alert('Error loading products: ' + error.message);
            
            const tbody = document.querySelector('#products-table tbody');
            tbody.innerHTML = '';
            
            data.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${p.ref}</td>
                    <td>${p.name}</td>
                    <td>${p.category}</td>
                    <td>
                        <button class="btn btn-outline" style="padding: 0.25rem 0.5rem; font-size: 0.875rem;" onclick='editProduct(${JSON.stringify(p).replace(/'/g, "&#39;")})'>Edit</button>
                        <button class="btn btn-danger" style="padding: 0.25rem 0.5rem; font-size: 0.875rem; margin-left: 0.5rem;" onclick="deleteProduct('${p.id}')">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Load Inquiries
        async function loadInquiries() {
            const { data, error } = await supabase.from('inquiries').select('*').order('created_at', { ascending: false });
            if (error) return alert('Error loading inquiries: ' + error.message);
            
            const tbody = document.querySelector('#inquiries-table tbody');
            tbody.innerHTML = '';
            
            data.forEach(i => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${new Date(i.created_at).toLocaleDateString()}</td>
                    <td>${i.name}</td>
                    <td><a href="mailto:${i.email}" style="color: var(--color-primary);">${i.email}</a></td>
                    <td><div style="max-height: 100px; overflow-y: auto;">${i.message}</div></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Product Modal Logic
        const modal = document.getElementById('product-modal');
        const form = document.getElementById('product-form');

        function openProductModal() {
            form.reset();
            document.getElementById('p-id').value = '';
            document.getElementById('modal-title').textContent = 'Add Product';
            modal.classList.add('active');
        }

        function closeProductModal() {
            modal.classList.remove('active');
        }

        function editProduct(product) {
            document.getElementById('p-id').value = product.id;
            document.getElementById('p-ref').value = product.ref;
            document.getElementById('p-name').value = product.name;
            document.getElementById('p-category').value = product.category;
            document.getElementById('p-image').value = product.image_url || '';
            document.getElementById('p-short-desc').value = product.short_description || '';
            document.getElementById('modal-title').textContent = 'Edit Product';
            modal.classList.add('active');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('p-id').value;
            const productData = {
                ref: document.getElementById('p-ref').value,
                name: document.getElementById('p-name').value,
                category: document.getElementById('p-category').value,
                image_url: document.getElementById('p-image').value,
                short_description: document.getElementById('p-short-desc').value
            };

            let result;
            if (id) {
                result = await supabase.from('products').update(productData).eq('id', id);
            } else {
                result = await supabase.from('products').insert([productData]);
            }

            if (result.error) {
                alert('Error saving product: ' + result.error.message);
            } else {
                closeProductModal();
                loadProducts();
            }
        });

        async function deleteProduct(id) {
            if (confirm('Are you sure you want to delete this product?')) {
                const { error } = await supabase.from('products').delete().eq('id', id);
                if (error) alert('Error deleting product: ' + error.message);
                else loadProducts();
            }
        }

        // Initialize
        checkAuth();
    </script>
</body>
</html>
