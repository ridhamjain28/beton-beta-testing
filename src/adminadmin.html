<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | BETON LIGHTING</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; color: #1a1a2e; font-size: 14px; }

        /* ── LOGIN ───────────────────────────────────────── */
        #login-page {
            min-height: 100vh; display: flex;
            align-items: center; justify-content: center; background: #f0f2f5;
        }
        .login-box {
            background: #fff; border: 1px solid #e0e0e0; border-radius: 10px;
            padding: 2.5rem 2.25rem; width: 100%; max-width: 380px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
        }
        .login-box h1 { font-size: 1.3rem; font-weight: 700; color: #134095; margin-bottom: 0.2rem; }
        .login-box p  { color: #6b7280; font-size: 0.82rem; margin-bottom: 1.75rem; }
        .lfield { margin-bottom: 1rem; }
        .lfield label { display: block; font-weight: 500; font-size: 0.8rem; color: #374151; margin-bottom: 0.35rem; }
        .lfield input {
            width: 100%; padding: 0.6rem 0.75rem; border: 1px solid #d1d5db;
            border-radius: 6px; font-size: 0.9rem; font-family: 'Inter', sans-serif; color: #111827;
        }
        .lfield input:focus { outline: none; border-color: #134095; box-shadow: 0 0 0 3px rgba(19,64,149,0.1); }
        .btn-login {
            width: 100%; padding: 0.7rem; background: #134095; color: #fff;
            font-weight: 600; font-size: 0.9rem; border: none; border-radius: 6px;
            cursor: pointer; font-family: 'Inter', sans-serif; margin-top: 0.25rem;
        }
        .btn-login:hover { background: #0f3278; }
        #login-error { color: #dc2626; font-size: 0.8rem; margin-top: 0.65rem; text-align: center; display: none; }

        /* ── DASHBOARD ───────────────────────────────────── */
        #dashboard-page { display: none; }

        .topbar {
            background: #fff; border-bottom: 1px solid #e0e0e0;
            padding: 0.85rem 1.75rem; display: flex; align-items: center; justify-content: space-between;
        }
        .topbar-left h2 { font-size: 1rem; font-weight: 700; color: #111827; }
        .topbar-left p  { font-size: 0.78rem; color: #6b7280; margin-top: 1px; }
        .topbar-right   { display: flex; gap: 0.5rem; }
        .btn-topbar-outline {
            padding: 0.42rem 1rem; background: transparent; border: 1px solid #d1d5db;
            border-radius: 6px; font-size: 0.82rem; font-weight: 500; color: #374151;
            cursor: pointer; font-family: 'Inter', sans-serif; text-decoration: none;
            display: inline-flex; align-items: center;
        }
        .btn-topbar-outline:hover { background: #f9fafb; }
        .btn-topbar-primary {
            padding: 0.42rem 1rem; background: #134095; color: #fff; border: none;
            border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        .btn-topbar-primary:hover { background: #0f3278; }

        .main { padding: 1.5rem; max-width: 1000px; margin: 0 auto; }

        /* Tabs */
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
        .tab-btn {
            padding: 0.48rem 1.25rem; border: 1px solid #d1d5db; border-radius: 6px;
            background: #fff; font-size: 0.875rem; font-weight: 500; color: #374151;
            cursor: pointer; font-family: 'Inter', sans-serif;
        }
        .tab-btn.active { background: #134095; color: #fff; border-color: #134095; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* ── CARD ─────────────────────────────────────── */
        .card {
            background: #fff; border: 1px solid #e0e0e0; border-radius: 10px;
            margin-bottom: 1.25rem; overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }
        .card-title-row {
            display: flex; align-items: center; gap: 0.6rem;
            padding: 1.1rem 1.5rem 1rem; border-bottom: 1px solid #e9ecef;
        }
        .card-title-row .plus-icon { color: #134095; font-size: 1.1rem; font-weight: 700; }
        .card-title-row h3 { font-size: 1rem; font-weight: 700; color: #111827; }

        /* ── FORM ─────────────────────────────────────── */
        .form-body { padding: 1.25rem 1.5rem 0.5rem; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 1.25rem; margin-bottom: 1rem; }
        .form-row.single { grid-template-columns: 1fr; }

        .form-field { display: flex; flex-direction: column; gap: 0.3rem; }
        .form-field label { font-size: 0.8rem; font-weight: 500; color: #374151; }
        .form-field label .req { color: #dc2626; margin-left: 2px; }
        .form-field input,
        .form-field select,
        .form-field textarea {
            padding: 0.55rem 0.75rem; border: 1px solid #d1d5db; border-radius: 6px;
            font-size: 0.875rem; font-family: 'Inter', sans-serif; color: #111827; background: #fff;
        }
        .form-field input:focus,
        .form-field select:focus,
        .form-field textarea:focus {
            outline: none; border-color: #134095; box-shadow: 0 0 0 3px rgba(19,64,149,0.1);
        }
        .form-field textarea { resize: vertical; min-height: 90px; }

        .form-save-row { padding: 1rem 1.5rem 1.25rem; }
        .btn-save {
            width: 100%; padding: 0.75rem; background: #134095; color: #fff;
            font-weight: 600; font-size: 0.9rem; border: none; border-radius: 6px;
            cursor: pointer; font-family: 'Inter', sans-serif; display: flex;
            align-items: center; justify-content: center; gap: 0.5rem;
        }
        .btn-save:hover { background: #0f3278; }
        .btn-save svg { width: 16px; height: 16px; }

        /* ── PRODUCTS TABLE ───────────────────────────── */
        .table-card-header {
            padding: 1rem 1.5rem; border-bottom: 1px solid #e9ecef;
        }
        .table-card-header h3 { font-size: 1rem; font-weight: 700; color: #111827; }

        table { width: 100%; border-collapse: collapse; }
        thead th {
            padding: 0.7rem 1rem; text-align: left; font-size: 0.72rem; font-weight: 700;
            color: #6b7280; text-transform: uppercase; letter-spacing: 0.06em;
            border-bottom: 2px solid #e9ecef; background: #fafafa;
        }
        thead th:first-child { padding-left: 1.5rem; }
        thead th:last-child  { padding-right: 1.5rem; text-align: right; }

        tbody td {
            padding: 0.9rem 1rem; font-size: 0.875rem;
            border-bottom: 1px solid #f3f4f6; vertical-align: middle;
        }
        tbody td:first-child { padding-left: 1.5rem; }
        tbody td:last-child  { padding-right: 1.5rem; text-align: right; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #f9fafb; }

        .product-name { font-weight: 600; color: #111827; font-size: 0.875rem; }
        .product-meta { font-size: 0.75rem; color: #6b7280; margin-top: 2px; }
        .ref-badge {
            display: inline-block; background: #eff6ff; color: #1d4ed8;
            padding: 0.18rem 0.5rem; border-radius: 4px; font-size: 0.72rem; font-weight: 600;
        }
        .category-text { color: #6b7280; font-size: 0.82rem; }

        .action-icon {
            background: none; border: none; cursor: pointer; padding: 0.3rem;
            border-radius: 4px; display: inline-flex; align-items: center;
        }
        .action-icon:hover { background: #f3f4f6; }
        .action-icon svg { width: 16px; height: 16px; }
        .icon-edit  { color: #3b82f6; }
        .icon-delete { color: #ef4444; }

        .empty-row td { text-align: center; padding: 2.5rem; color: #9ca3af; font-style: italic; }

        /* Editing state highlight */
        #form-card { transition: box-shadow 0.2s; }
        #form-card.editing { box-shadow: 0 0 0 2px #134095, 0 4px 16px rgba(19,64,149,0.12); }
        #editing-banner {
            display: none; background: #eff6ff; border-bottom: 1px solid #bfdbfe;
            padding: 0.6rem 1.5rem; font-size: 0.8rem; color: #1d4ed8; font-weight: 500;
            align-items: center; justify-content: space-between;
        }
        #editing-banner.visible { display: flex; }
        #cancel-edit-btn {
            background: none; border: 1px solid #93c5fd; color: #1d4ed8;
            padding: 0.2rem 0.65rem; border-radius: 4px; cursor: pointer;
            font-size: 0.78rem; font-family: 'Inter', sans-serif;
        }

        /* Inquiries */
        .inq-date { white-space: nowrap; color: #6b7280; font-size: 0.8rem; }
        .inq-name { font-weight: 600; }
        .inq-email a { color: #134095; text-decoration: none; }
        .inq-msg   { max-width: 320px; color: #374151; font-size: 0.82rem; }
    </style>
</head>
<body>

<!-- ══ LOGIN ═══════════════════════════════════════════════ -->
<div id="login-page">
    <div class="login-box">
        <h1>BETON LIGHTING</h1>
        <p>Admin Portal — sign in to continue</p>
        <form id="login-form" autocomplete="off">
            <div class="lfield">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="admin@betonlighting.com" required>
            </div>
            <div class="lfield">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">Log In</button>
            <p id="login-error">Invalid email or password.</p>
        </form>
    </div>
</div>

<!-- ══ DASHBOARD ════════════════════════════════════════════ -->
<div id="dashboard-page">

    <div class="topbar">
        <div class="topbar-left">
            <h2>Admin Dashboard</h2>
            <p>Manage products and view inquiries.</p>
        </div>
        <div class="topbar-right">
            <a href="index.html" class="btn-topbar-outline" target="_blank">View Site</a>
            <button class="btn-topbar-primary" id="logout-btn">Log Out</button>
        </div>
    </div>

    <div class="main">

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('products', this)">Products</button>
            <button class="tab-btn" onclick="switchTab('inquiries', this)">Inquiries</button>
        </div>

        <!-- ── PRODUCTS TAB ─────────────────────────── -->
        <div id="tab-products" class="tab-pane active">

            <!-- Add / Edit Form -->
            <div class="card" id="form-card">
                <div id="editing-banner">
                    <span>✏️ Editing product — <span id="editing-ref"></span></span>
                    <button id="cancel-edit-btn" onclick="cancelEdit()">Cancel</button>
                </div>
                <div class="card-title-row">
                    <span class="plus-icon" id="form-icon">+</span>
                    <h3 id="form-title">Add New Product</h3>
                </div>
                <div class="form-body">
                    <input type="hidden" id="p-id">
                    <div class="form-row">
                        <div class="form-field">
                            <label>Reference <span class="req">*</span></label>
                            <input type="text" id="p-ref" placeholder="e.g. B-204">
                        </div>
                        <div class="form-field">
                            <label>Category <span class="req">*</span></label>
                            <input type="text" id="p-category" placeholder="e.g. Indoor Lighting">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-field">
                            <label>Product Name <span class="req">*</span></label>
                            <input type="text" id="p-name" placeholder="e.g. Apex Recessed Downlight">
                        </div>
                        <div class="form-field">
                            <label>Image URL</label>
                            <input type="text" id="p-image" placeholder="assets/images/products/sys-01.webp">
                        </div>
                    </div>
                    <div class="form-row single">
                        <div class="form-field">
                            <label>Short Description</label>
                            <textarea id="p-short-desc" placeholder="Brief product description…"></textarea>
                        </div>
                    </div>
                </div>
                <div class="form-save-row">
                    <button class="btn-save" onclick="saveProduct()">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
                        <span id="save-btn-text">Save Product</span>
                    </button>
                </div>
            </div>

            <!-- Products Table -->
            <div class="card">
                <div class="table-card-header">
                    <h3>All Products</h3>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Ref</th>
                            <th>Product Details</th>
                            <th>Category</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="products-tbody">
                        <tr class="empty-row"><td colspan="4">Loading…</td></tr>
                    </tbody>
                </table>
            </div>

        </div>

        <!-- ── INQUIRIES TAB ────────────────────────── -->
        <div id="tab-inquiries" class="tab-pane">
            <div class="card">
                <div class="table-card-header">
                    <h3>Recent Inquiries</h3>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Message</th>
                        </tr>
                    </thead>
                    <tbody id="inquiries-tbody">
                        <tr class="empty-row"><td colspan="4">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ── Supabase init ─────────────────────────────────────
    const _db = supabase.createClient(
        'https://kageeyipltwnsuuhkwfm.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthZ2VleWlwbHR3bnN1dWhrd2ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNTkyNDgsImV4cCI6MjEwMDgzNTI0OH0.U93etZwUGIP5EYs9zV7bj5b7SU82VXQ4naqIHu8LTck'
    );

    // ── Hardcoded auth ────────────────────────────────────
    const _u = atob('YWRtaW5AYmV0b25saWdodGluZy5jb20=');
    const _p = atob('QmV0b25AMjAyNg==');

    function checkAuth() {
        if (sessionStorage.getItem('bl_admin') === '1') showDashboard();
    }
    function showDashboard() {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('dashboard-page').style.display = 'block';
        loadProducts();
    }

    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const pass  = document.getElementById('login-password').value;
        const err   = document.getElementById('login-error');
        err.style.display = 'none';
        if (email === _u && pass === _p) {
            sessionStorage.setItem('bl_admin', '1');
            showDashboard();
        } else {
            err.style.display = 'block';
        }
    });

    document.getElementById('logout-btn').addEventListener('click', function() {
        sessionStorage.removeItem('bl_admin');
        document.getElementById('dashboard-page').style.display = 'none';
        document.getElementById('login-page').style.display = 'flex';
    });

    // ── Tabs ─────────────────────────────────────────────
    function switchTab(name, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + name).classList.add('active');
        if (name === 'inquiries') loadInquiries();
    }

    // ── Load Products ─────────────────────────────────────
    async function loadProducts() {
        const tbody = document.getElementById('products-tbody');
        tbody.innerHTML = '<tr class="empty-row"><td colspan="4">Loading…</td></tr>';
        try {
            const { data, error } = await _db.from('products').select('*').order('ref', { ascending: true });
            if (error) throw error;
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr class="empty-row"><td colspan="4">No products yet — add one above.</td></tr>';
                return;
            }
            tbody.innerHTML = '';
            data.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="ref-badge">${p.ref || '—'}</span></td>
                    <td>
                        <div class="product-name">${p.name || '—'}</div>
                        <div class="product-meta">${p.short_description ? p.short_description.substring(0, 70) + (p.short_description.length > 70 ? '…' : '') : 'No description'}</div>
                    </td>
                    <td><span class="category-text">${p.category || '—'}</span></td>
                    <td>
                        <button class="action-icon icon-edit" title="Edit" onclick='startEdit(${JSON.stringify(p).replace(/'/g,"&#39;")})'>
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                        </button>
                        <button class="action-icon icon-delete" title="Delete" onclick="deleteProduct('${p.id}', '${p.ref}')">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (err) {
            tbody.innerHTML = `<tr class="empty-row"><td colspan="4">Error: ${err.message}</td></tr>`;
        }
    }

    // ── Load Inquiries ────────────────────────────────────
    async function loadInquiries() {
        const tbody = document.getElementById('inquiries-tbody');
        tbody.innerHTML = '<tr class="empty-row"><td colspan="4">Loading…</td></tr>';
        try {
            const { data, error } = await _db.from('inquiries').select('*').order('created_at', { ascending: false });
            if (error) throw error;
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr class="empty-row"><td colspan="4">No inquiries yet.</td></tr>';
                return;
            }
            tbody.innerHTML = '';
            data.forEach(i => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="inq-date">${new Date(i.created_at).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' })}</td>
                    <td class="inq-name">${i.name || '—'}</td>
                    <td class="inq-email"><a href="mailto:${i.email}">${i.email || '—'}</a></td>
                    <td class="inq-msg">${i.message || '—'}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (err) {
            tbody.innerHTML = `<tr class="empty-row"><td colspan="4">Error: ${err.message}</td></tr>`;
        }
    }

    // ── Form Logic ────────────────────────────────────────
    function clearForm() {
        document.getElementById('p-id').value = '';
        document.getElementById('p-ref').value = '';
        document.getElementById('p-name').value = '';
        document.getElementById('p-category').value = '';
        document.getElementById('p-image').value = '';
        document.getElementById('p-short-desc').value = '';
        document.getElementById('form-title').textContent = 'Add New Product';
        document.getElementById('form-icon').textContent = '+';
        document.getElementById('save-btn-text').textContent = 'Save Product';
        document.getElementById('form-card').classList.remove('editing');
        document.getElementById('editing-banner').classList.remove('visible');
    }

    function cancelEdit() { clearForm(); }

    function startEdit(p) {
        document.getElementById('p-id').value         = p.id || '';
        document.getElementById('p-ref').value        = p.ref || '';
        document.getElementById('p-name').value       = p.name || '';
        document.getElementById('p-category').value   = p.category || '';
        document.getElementById('p-image').value      = p.image_url || '';
        document.getElementById('p-short-desc').value = p.short_description || '';
        document.getElementById('form-title').textContent = 'Edit Product';
        document.getElementById('form-icon').textContent = '✏️';
        document.getElementById('save-btn-text').textContent = 'Update Product';
        document.getElementById('form-card').classList.add('editing');
        document.getElementById('editing-banner').classList.add('visible');
        document.getElementById('editing-ref').textContent = p.ref;
        // Scroll to form
        document.getElementById('form-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    async function saveProduct() {
        const id = document.getElementById('p-id').value;
        const payload = {
            ref:               document.getElementById('p-ref').value.trim(),
            name:              document.getElementById('p-name').value.trim(),
            category:          document.getElementById('p-category').value.trim(),
            image_url:         document.getElementById('p-image').value.trim(),
            short_description: document.getElementById('p-short-desc').value.trim()
        };

        if (!payload.ref || !payload.name || !payload.category) {
            alert('Please fill in Reference, Product Name and Category.');
            return;
        }

        const btn = document.querySelector('.btn-save');
        btn.disabled = true;
        document.getElementById('save-btn-text').textContent = 'Saving…';

        try {
            let result;
            if (id) {
                result = await _db.from('products').update(payload).eq('id', id);
            } else {
                result = await _db.from('products').insert([payload]);
            }
            if (result.error) throw result.error;
            clearForm();
            await loadProducts();
        } catch (err) {
            alert('Error saving product: ' + err.message);
        } finally {
            btn.disabled = false;
            document.getElementById('save-btn-text').textContent = id ? 'Update Product' : 'Save Product';
        }
    }

    async function deleteProduct(id, ref) {
        if (!confirm(`Delete "${ref}"? This cannot be undone.`)) return;
        try {
            const { error } = await _db.from('products').delete().eq('id', id);
            if (error) throw error;
            await loadProducts();
        } catch (err) {
            alert('Error deleting: ' + err.message);
        }
    }

    // ── Init ──────────────────────────────────────────────
    checkAuth();
</script>
</body>
</html>
