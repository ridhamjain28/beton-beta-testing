<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | BETON LIGHTING</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #f3f4f6;
            color: #111827;
            font-size: 14px;
        }

        /* ── Login ─────────────────────────────────── */
        #login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
        }
        .login-box {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 380px;
        }
        .login-box h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #134095;
            margin-bottom: 0.25rem;
        }
        .login-box p {
            color: #6b7280;
            font-size: 0.85rem;
            margin-bottom: 1.75rem;
        }
        .field { margin-bottom: 1rem; }
        .field label {
            display: block;
            font-weight: 500;
            font-size: 0.8rem;
            color: #374151;
            margin-bottom: 0.35rem;
        }
        .field input {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            color: #111827;
            background: #fff;
            transition: border-color 0.15s;
        }
        .field input:focus {
            outline: none;
            border-color: #134095;
            box-shadow: 0 0 0 3px rgba(19,64,149,0.1);
        }
        .btn-primary {
            width: 100%;
            padding: 0.65rem;
            background: #134095;
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 0.5rem;
            font-family: 'Inter', sans-serif;
            transition: background 0.15s;
        }
        .btn-primary:hover { background: #0f3278; }
        #login-error {
            color: #dc2626;
            font-size: 0.8rem;
            margin-top: 0.75rem;
            text-align: center;
            display: none;
        }

        /* ── Dashboard ─────────────────────────────── */
        #dashboard-page { display: none; }

        .topbar {
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            padding: 0.9rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .topbar-left h2 {
            font-size: 1rem;
            font-weight: 700;
            color: #111827;
        }
        .topbar-left span {
            font-size: 0.8rem;
            color: #6b7280;
        }
        .topbar-right { display: flex; gap: 0.5rem; }

        .btn-outline {
            padding: 0.45rem 1rem;
            background: transparent;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #374151;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: background 0.15s;
        }
        .btn-outline:hover { background: #f9fafb; }
        .btn-sm {
            padding: 0.45rem 1rem;
            background: #134095;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: background 0.15s;
        }
        .btn-sm:hover { background: #0f3278; }

        .main { padding: 1.5rem; max-width: 1100px; margin: 0 auto; }

        /* Tabs */
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
        .tab-btn {
            padding: 0.5rem 1.25rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #fff;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.15s;
        }
        .tab-btn.active {
            background: #134095;
            color: #fff;
            border-color: #134095;
        }

        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* Card */
        .card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid #e5e7eb;
        }
        .card-header h3 { font-size: 0.95rem; font-weight: 600; }

        /* Table */
        table { width: 100%; border-collapse: collapse; }
        thead th {
            padding: 0.65rem 1.25rem;
            text-align: left;
            font-size: 0.78rem;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-bottom: 1px solid #e5e7eb;
        }
        tbody td {
            padding: 0.85rem 1.25rem;
            font-size: 0.875rem;
            border-bottom: 1px solid #f3f4f6;
            vertical-align: middle;
        }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #f9fafb; }

        .action-btn {
            padding: 0.3rem 0.65rem;
            font-size: 0.78rem;
            font-weight: 500;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            border: 1px solid transparent;
            transition: all 0.15s;
        }
        .action-edit { background: #f3f4f6; color: #374151; border-color: #d1d5db; }
        .action-edit:hover { background: #e5e7eb; }
        .action-delete { background: #fef2f2; color: #dc2626; border-color: #fecaca; margin-left: 0.35rem; }
        .action-delete:hover { background: #fee2e2; }

        .empty-row td { text-align: center; padding: 2rem; color: #9ca3af; font-style: italic; }

        /* Modal Overlay */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .overlay.open { display: flex; }

        .modal {
            background: #fff;
            border-radius: 10px;
            width: 100%;
            max-width: 540px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.1rem 1.5rem;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 1;
        }
        .modal-header h3 { font-size: 1rem; font-weight: 600; }
        .close-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: #9ca3af;
            cursor: pointer;
            line-height: 1;
            padding: 0.2rem;
        }
        .close-btn:hover { color: #374151; }

        .modal-body { padding: 1.5rem; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .form-grid .full { grid-column: 1 / -1; }

        .form-field { display: flex; flex-direction: column; gap: 0.35rem; }
        .form-field label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #374151;
        }
        .form-field label .req { color: #dc2626; margin-left: 2px; }
        .form-field input,
        .form-field select,
        .form-field textarea {
            padding: 0.6rem 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.875rem;
            font-family: 'Inter', sans-serif;
            color: #111827;
            background: #fff;
            transition: border-color 0.15s;
        }
        .form-field input:focus,
        .form-field select:focus,
        .form-field textarea:focus {
            outline: none;
            border-color: #134095;
            box-shadow: 0 0 0 3px rgba(19,64,149,0.1);
        }
        .form-field textarea { resize: vertical; min-height: 80px; }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            padding: 1rem 1.5rem;
            border-top: 1px solid #e5e7eb;
            margin-top: 0.5rem;
        }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            background: #eff6ff;
            color: #1d4ed8;
        }
    </style>
</head>
<body>

<!-- ══ LOGIN PAGE ══════════════════════════════════════════ -->
<div id="login-page">
    <div class="login-box">
        <h1>BETON LIGHTING</h1>
        <p>Admin Portal — sign in to continue</p>
        <form id="login-form" autocomplete="off">
            <div class="field">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="admin@betonlighting.com" required>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary">Log In</button>
            <p id="login-error">Invalid email or password.</p>
        </form>
    </div>
</div>

<!-- ══ DASHBOARD PAGE ══════════════════════════════════════ -->
<div id="dashboard-page">

    <!-- Top Bar -->
    <div class="topbar">
        <div class="topbar-left">
            <h2>Admin Dashboard</h2>
            <span>Manage products and view inquiries.</span>
        </div>
        <div class="topbar-right">
            <a href="index.html" class="btn-outline" target="_blank">View Site</a>
            <button class="btn-sm" id="logout-btn">Log Out</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main">

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('products', this)">Products</button>
            <button class="tab-btn" onclick="switchTab('inquiries', this)">Inquiries</button>
        </div>

        <!-- Products Tab -->
        <div id="tab-products" class="tab-pane active">
            <div class="card">
                <div class="card-header">
                    <h3>All Products</h3>
                    <button class="btn-sm" onclick="openModal()">+ Add Product</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Ref</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="products-tbody">
                        <tr class="empty-row"><td colspan="4">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Inquiries Tab -->
        <div id="tab-inquiries" class="tab-pane">
            <div class="card">
                <div class="card-header">
                    <h3>Recent Inquiries</h3>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Message</th>
                        </tr>
                    </thead>
                    <tbody id="inquiries-tbody">
                        <tr class="empty-row"><td colspan="4">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div><!-- /main -->
</div><!-- /dashboard -->

<!-- ══ PRODUCT MODAL ═══════════════════════════════════════ -->
<div class="overlay" id="product-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modal-title">Add Product</h3>
            <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
            <form id="product-form">
                <input type="hidden" id="p-id">
                <div class="form-grid">
                    <div class="form-field">
                        <label>Reference <span class="req">*</span></label>
                        <input type="text" id="p-ref" placeholder="e.g. B-204" required>
                    </div>
                    <div class="form-field">
                        <label>Category <span class="req">*</span></label>
                        <input type="text" id="p-category" placeholder="e.g. Downlights" required>
                    </div>
                    <div class="form-field full">
                        <label>Product Name <span class="req">*</span></label>
                        <input type="text" id="p-name" placeholder="e.g. Slim Panel Light" required>
                    </div>
                    <div class="form-field full">
                        <label>Image URL</label>
                        <input type="text" id="p-image" placeholder="assets/images/products/...">
                    </div>
                    <div class="form-field full">
                        <label>Short Description</label>
                        <textarea id="p-short-desc" placeholder="Brief product description…"></textarea>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn-outline" onclick="closeModal()">Cancel</button>
            <button class="btn-sm" onclick="saveProduct()">Save Product</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // Initialize Supabase directly — avoids window.supabase conflict
    const _db = supabase.createClient(
        'https://kageeyipltwnsuuhkwfm.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthZ2VleWlwbHR3bnN1dWhrd2ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNTkyNDgsImV4cCI6MjEwMDgzNTI0OH0.U93etZwUGIP5EYs9zV7bj5b7SU82VXQ4naqIHu8LTck'
    );
</script>
<script>
    // ── Hardcoded auth (base64 encoded) ──────────────────
    const _u = atob('YWRtaW5AYmV0b25saWdodGluZy5jb20=');
    const _p = atob('QmV0b25AMjAyNg==');

    // ── Auth ─────────────────────────────────────────────
    function checkAuth() {
        if (sessionStorage.getItem('bl_admin') === '1') showDashboard();
    }

    function showDashboard() {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('dashboard-page').style.display = 'block';
        loadProducts();
    }

    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const pass  = document.getElementById('login-password').value;
        const err   = document.getElementById('login-error');
        err.style.display = 'none';
        if (email === _u && pass === _p) {
            sessionStorage.setItem('bl_admin', '1');
            showDashboard();
        } else {
            err.style.display = 'block';
        }
    });

    document.getElementById('logout-btn').addEventListener('click', function() {
        sessionStorage.removeItem('bl_admin');
        document.getElementById('dashboard-page').style.display = 'none';
        document.getElementById('login-page').style.display = 'flex';
    });

    // ── Tabs ─────────────────────────────────────────────
    function switchTab(name, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + name).classList.add('active');
        if (name === 'inquiries') loadInquiries();
    }

    // ── Products ──────────────────────────────────────────
    async function loadProducts() {
        const tbody = document.getElementById('products-tbody');
        tbody.innerHTML = '<tr class="empty-row"><td colspan="4">Loading…</td></tr>';
        try {
            const { data, error } = await _db.from('products').select('*').order('ref', { ascending: true });
            if (error) throw error;
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr class="empty-row"><td colspan="4">No products yet. Click + Add Product to get started.</td></tr>';
                return;
            }
            tbody.innerHTML = '';
            data.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="badge">${p.ref || '—'}</span></td>
                    <td>${p.name || '—'}</td>
                    <td>${p.category || '—'}</td>
                    <td>
                        <button class="action-btn action-edit" onclick='editProduct(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Edit</button>
                        <button class="action-btn action-delete" onclick="deleteProduct('${p.id}')">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (err) {
            tbody.innerHTML = `<tr class="empty-row"><td colspan="4">Error loading products: ${err.message}</td></tr>`;
        }
    }

    // ── Inquiries ─────────────────────────────────────────
    async function loadInquiries() {
        const tbody = document.getElementById('inquiries-tbody');
        tbody.innerHTML = '<tr class="empty-row"><td colspan="4">Loading…</td></tr>';
        try {
            const { data, error } = await _db.from('inquiries').select('*').order('created_at', { ascending: false });
            if (error) throw error;
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr class="empty-row"><td colspan="4">No inquiries yet.</td></tr>';
                return;
            }
            tbody.innerHTML = '';
            data.forEach(i => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="white-space:nowrap">${new Date(i.created_at).toLocaleDateString('en-IN')}</td>
                    <td>${i.name || '—'}</td>
                    <td><a href="mailto:${i.email}" style="color:#134095;text-decoration:none;">${i.email || '—'}</a></td>
                    <td style="max-width:320px;white-space:pre-wrap;">${i.message || '—'}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (err) {
            tbody.innerHTML = `<tr class="empty-row"><td colspan="4">Error loading inquiries: ${err.message}</td></tr>`;
        }
    }

    // ── Modal ─────────────────────────────────────────────
    function openModal() {
        document.getElementById('product-form').reset();
        document.getElementById('p-id').value = '';
        document.getElementById('modal-title').textContent = 'Add Product';
        document.getElementById('product-overlay').classList.add('open');
    }

    function closeModal() {
        document.getElementById('product-overlay').classList.remove('open');
    }

    function editProduct(p) {
        document.getElementById('p-id').value        = p.id || '';
        document.getElementById('p-ref').value       = p.ref || '';
        document.getElementById('p-name').value      = p.name || '';
        document.getElementById('p-category').value  = p.category || '';
        document.getElementById('p-image').value     = p.image_url || '';
        document.getElementById('p-short-desc').value= p.short_description || '';
        document.getElementById('modal-title').textContent = 'Edit Product';
        document.getElementById('product-overlay').classList.add('open');
    }

    async function saveProduct() {
        const id = document.getElementById('p-id').value;
        const payload = {
            ref:               document.getElementById('p-ref').value.trim(),
            name:              document.getElementById('p-name').value.trim(),
            category:          document.getElementById('p-category').value.trim(),
            image_url:         document.getElementById('p-image').value.trim(),
            short_description: document.getElementById('p-short-desc').value.trim()
        };

        if (!payload.ref || !payload.name || !payload.category) {
            alert('Please fill in Ref, Name and Category.');
            return;
        }

        try {
            let result;
            if (id) {
                result = await _db.from('products').update(payload).eq('id', id);
            } else {
                result = await _db.from('products').insert([payload]);
            }
            if (result.error) throw result.error;
            closeModal();
            loadProducts();
        } catch (err) {
            alert('Error saving product: ' + err.message);
        }
    }

    async function deleteProduct(id) {
        if (!confirm('Delete this product? This cannot be undone.')) return;
        try {
            const { error } = await _db.from('products').delete().eq('id', id);
            if (error) throw error;
            loadProducts();
        } catch (err) {
            alert('Error deleting product: ' + err.message);
        }
    }

    // Close overlay on backdrop click
    document.getElementById('product-overlay').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    // ── Init ──────────────────────────────────────────────
    checkAuth();
</script>
</body>
</html>
